<!doctype html><html lang="en"><meta charset="utf-8"><title>Project preview QA</title><style>body{font:18px/1.6 system-ui;padding:30px}iframe{position:fixed;left:-20000px;width:1440px;height:900px}pre{white-space:pre-wrap}</style><h1>Project preview QA</h1><p id="status">Running final regression checks</p><pre id="results"></pre><script>
const sources=['disclosure-browser.html','our-work-menu-browser.html'];async function run(){const results=[];for(const src of sources){results.push(await new Promise(resolve=>{const f=document.createElement('iframe');f.src=src;f.onload=()=>{const timer=setInterval(()=>{const s=f.contentDocument.querySelector('#status');if(s?.textContent.includes('failed.')){clearInterval(timer);resolve({src,status:s.textContent,failures:f.contentDocument.querySelector('#results')?.textContent.split('\n').filter(l=>l.startsWith('FAIL'))||[]});}},200)};document.body.append(f)}));} document.querySelector('#status').textContent='Final regression checks complete';document.querySelector('#results').textContent=results.map(r=>r.src+': '+r.status+'\n'+r.failures.join('\n')).join('\n');}run();</script></html>
