name: Validate allowlisted public site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-public-site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run complete test suite
        run: npm test
      - name: Build allowlisted public artifact
        run: npm run build:public
